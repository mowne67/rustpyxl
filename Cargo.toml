[package]
name = "rustpyxl"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Streaming XLSX core and Python bindings"

[lib]
name = "_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
quick-xml = "0.42"
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
crc32fast = "1"
tempfile = "3"
pyo3 = { version = "0.29.3", optional = true, features = ["extension-module", "abi3-py310"] }

[features]
python = ["dep:pyo3"]

[profile.release]
lto = "thin"
codegen-units = 1

